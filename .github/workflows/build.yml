name: Build CBT Checker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Grant write permissions for releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev build-essential ccache

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.6.0 cython==0.29.37 kivy==2.3.1

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-cbt-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v9
          restore-keys: |
            buildozer-cbt-${{ runner.os }}-

      - name: Set up Android SDK
        run: |
          java -version
          BSDK=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $BSDK

          if [ ! -f "$BSDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            wget -q --tries=5 --retry-connrefused \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -O /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p $BSDK/cmdline-tools/latest
            cp -r /tmp/cmdtools/cmdline-tools/* $BSDK/cmdline-tools/latest/
          fi

          SDKMANAGER=$BSDK/cmdline-tools/latest/bin/sdkmanager

          mkdir -p $BSDK/tools/bin
          ln -sf $SDKMANAGER $BSDK/tools/bin/sdkmanager

          yes | $SDKMANAGER --sdk_root=$BSDK --licenses > /dev/null 2>&1 || true

          if [ ! -d "$BSDK/build-tools/33.0.2" ]; then
            $SDKMANAGER --sdk_root=$BSDK \
              "build-tools;33.0.2" \
              "platforms;android-33" \
              "platform-tools"
          fi

          echo "ANDROID_HOME=$BSDK" >> $GITHUB_ENV
          echo "$BSDK/build-tools/33.0.2" >> $GITHUB_PATH
          echo "$BSDK/platform-tools" >> $GITHUB_PATH
          echo "$BSDK/tools/bin" >> $GITHUB_PATH

      - name: Set up NDK (symlink system r27 as r25b)
        run: |
          NDK_SRC=/usr/local/lib/android/sdk/ndk/27.3.13750724
          NDK_DEST=$HOME/.buildozer/android/platform/android-ndk-r25b

          if [ ! -d "$NDK_DEST" ]; then
            echo "Symlinking system NDK to $NDK_DEST"
            ln -s $NDK_SRC $NDK_DEST
          fi

          ls $NDK_DEST/toolchains && echo "NDK OK"

      - name: Pre-clone and patch python-for-android (Python 3.12.10)
        run: |
          P4A_DIR=/tmp/p4a-patched

          rm -rf "$P4A_DIR"
          git clone --depth 1 https://github.com/kivy/python-for-android.git "$P4A_DIR"

          # Patch python3 recipe: use 3.12.10 instead of 3.14.2
          PY3_FILE="$P4A_DIR/pythonforandroid/recipes/python3/__init__.py"
          sed -i "s/version = '3.14.2'/version = '3.12.10'/" "$PY3_FILE"
          sed -i "s|url = 'https://github.com/python/cpython/archive/refs/tags/v{version}.tar.gz'|url = 'https://www.python.org/ftp/python/{version}/Python-{version}.tgz'|" "$PY3_FILE"

          # Patch hostpython3 recipe: same version + URL change
          HPY_FILE="$P4A_DIR/pythonforandroid/recipes/hostpython3/__init__.py"
          sed -i 's/version = "3.14.2"/version = "3.12.10"/' "$HPY_FILE"
          sed -i 's|url = "https://github.com/python/cpython/archive/refs/tags/v{version}.tar.gz"|url = "https://www.python.org/ftp/python/{version}/Python-{version}.tgz"|' "$HPY_FILE"
          sed -i 's/patches = \["fix_ensurepip.patch"\]/patches = []/' "$HPY_FILE"

          # Fix libthorvg recipe bug (IndexError) - replace with no-op
          THORVG_DIR="$P4A_DIR/pythonforandroid/recipes/libthorvg"
          if [ -d "$THORVG_DIR" ]; then
            printf '%s\n' \
              'from pythonforandroid.recipe import Recipe' \
              '' \
              '' \
              'class LibThorVGRecipe(Recipe):' \
              '    """Minimal no-op libthorvg recipe (SVG support disabled)."""' \
              '    version = "0.14.4"' \
              '    url = "https://github.com/thorvg/thorvg/archive/v{version}.tar.gz"' \
              '' \
              '    def build_arch(self, arch):' \
              '        pass' \
              '' \
              '' \
              'recipe = LibThorVGRecipe()' \
              > "$THORVG_DIR/__init__.py"
            echo "Patched libthorvg recipe (no-op)"
          fi

          # Fix thorvg-python recipe if it exists
          THORVGPY_DIR="$P4A_DIR/pythonforandroid/recipes/thorvg-python"
          if [ -d "$THORVGPY_DIR" ]; then
            printf '%s\n' \
              'from pythonforandroid.recipe import Recipe' \
              '' \
              '' \
              'class ThorVGPythonRecipe(Recipe):' \
              '    """Minimal no-op thorvg-python recipe."""' \
              '    version = "0.1.0"' \
              '    url = ""' \
              '' \
              '    def build_arch(self, arch):' \
              '        pass' \
              '' \
              '' \
              'recipe = ThorVGPythonRecipe()' \
              > "$THORVGPY_DIR/__init__.py"
            echo "Patched thorvg-python recipe (no-op)"
          fi

          echo "=== python3 recipe ==="
          grep "version =\|url =" "$PY3_FILE" | head -2
          echo "=== hostpython3 recipe ==="
          grep "version =\|url =\|patches =" "$HPY_FILE" | head -3
          echo "=== p4a clone + patches OK ==="

      - name: Build APK (with retries)
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "=== Build attempt $attempt ==="
            buildozer android debug 2>&1
            EXIT=$?
            if [ $EXIT -eq 0 ]; then
              echo "Build succeeded on attempt $attempt"
              break
            fi
            echo "Attempt $attempt failed (exit $EXIT), retrying in 15s..."
            sleep 15
          done
          exit $EXIT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cbt-checker-apk
          path: bin/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CBT Registration Checker v1.0.${{ github.run_number }}
          body: |
            CBT Registration Checker

            Each student checks their own registration status on the
            UNI UYO CBT portal and shares it with their class rep.

            Download the .apk and install on your Android device.
            (Enable "Install from unknown sources" in Settings first)
          files: bin/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
